name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -sSL -o g.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q g.zip
          sudo mv Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Tests
        run: tools/run_tests.sh
